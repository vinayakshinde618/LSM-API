<div class="mt-4" id="mainContent">
  <div class="container container-box shadow-lg rounded">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h3 class="text-primary mb-0"><i class="fas fa-database me-2"></i>PostgreSQL Query Console</h3>
    </div>

    <!-- Schema Selection -->
    <div class="form-group mb-4">
      <label for="schemaSelect" class="fw-bold">Select Schema:</label>
      <select id="schemaSelect" class="form-select w-50 mt-1">
        <option>Select Schema</option>
      </select>
    </div>

    <!-- Query Input -->
    <div class="form-group mb-4">
      <label for="queryInput" class="fw-bold">SQL Query:</label>
      <textarea
        id="queryInput"
        class="form-control border border-secondary"
        placeholder="Write your SQL query here... (SELECT, CREATE TABLE, ALTER TABLE ADD COLUMN...)"
      ></textarea>
    </div>

    <button id="executeQueryButton" class="btn btn-success px-4 py-2">
      <i class="fas fa-play me-1"></i>Run Query
    </button>

    <!-- Result Section -->
    <div id="resultContainer" class="hidden mt-4">
      <h5 id="queryTypeHeading" class="text-info fw-bold"></h5>
      <input type="text" id="searchInput" class="form-control mb-3" placeholder="Search in results...">
      <div class="table-responsive">
        <table id="resultTable" class="table table-striped table-bordered align-middle">
          <thead class="table-light"><tr id="tableHeaders"></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="d-flex align-items-center justify-content-between">
        <button id="prevPage" class="btn btn-secondary" disabled>Previous</button>
        <span id="pageInfo" class="fw-bold text-muted"></span>
        <button id="nextPage" class="btn btn-secondary">Next</button>
      </div>
    </div>
  </div>

  <!-- Password Modal -->
  <div class="modal fade" id="passwordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title"><i class="fas fa-lock me-2"></i>Authorization Required</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>Please enter the password to execute ALTER query:</p>
          <input type="password" id="alterPassword" class="form-control" placeholder="Enter Password" />
          <small id="passwordError" class="text-danger mt-2 d-none">Incorrect password. Try again.</small>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" id="confirmPasswordButton" class="btn btn-primary">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <!-- JS Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let filteredData = [];
    let currentPage = 1;
    const rowsPerPage = 10;
    let pendingAlterQuery = null;
    const correctPassword = "Loomer#2023";

    $(document).ready(function () {
      fetchSchemas();

      function fetchSchemas() {
        fetch(`${config.base_url}/api/schemaList`)
          .then((res) => res.json())
          .then((data) => {
            if (data.code === 1 && Array.isArray(data.data)) {
              populateDropdown($("#schemaSelect"), data.data, "Select Schema");
            } else {
              console.error("Failed to fetch schema list");
            }
          })
          .catch((err) => console.error("Error:", err));
      }

      function populateDropdown(select, items, defaultText) {
        select.empty().append(`<option>${defaultText}</option>`);
        items.forEach((item) => select.append(new Option(item, item)));
      }

      $("#executeQueryButton").click(async function () {
        const query = $("#queryInput").val().trim();
        const schema = $("#schemaSelect").val();

        if (!schema || schema === "Select Schema") {
          alert("Please select a schema first.");
          return;
        }
        if (!query) {
          alert("Please enter a query.");
          return;
        }
        if (!isAllowedQuery(query)) {
          alert("❌ Destructive or Rename queries are not allowed.");
          return;
        }

        // If query contains ALTER -> ask for password
        if (/\\balter\\b/i.test(query)) {
          pendingAlterQuery = { schema, query };
          $("#alterPassword").val("");
          $("#passwordError").addClass("d-none");
          const modal = new bootstrap.Modal(document.getElementById("passwordModal"));
          modal.show();
        } else {
          executeQuery({ schema, query });
        }
      });

      $("#confirmPasswordButton").click(function () {
        const enteredPass = $("#alterPassword").val();
        if (enteredPass === correctPassword) {
          $("#passwordError").addClass("d-none");
          bootstrap.Modal.getInstance(document.getElementById("passwordModal")).hide();
          executeQuery(pendingAlterQuery);
          pendingAlterQuery = null;
        } else {
          $("#passwordError").removeClass("d-none");
        }
      });

      async function executeQuery(payload) {
        try {
          const response = await fetch(`${config.base_url}/api/runQuery`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await response.json();

          if (data.code === 1 && Array.isArray(data.data)) {
            filteredData = data.data;
            currentPage = 1;
            displayTable(filteredData);
            $("#queryTypeHeading").text("✅ Query Results");
            $("#resultContainer").removeClass("hidden");
          } else {
            $("#resultContainer").removeClass("hidden");
            $("#queryTypeHeading").text(data.message || "Query Executed Successfully");
            $("#tableHeaders").empty();
            $("#tableBody").html("<tr><td class='text-center text-muted'>No data returned</td></tr>");
          }
        } catch (error) {
          console.error("Error:", error);
          alert("Error executing query. Check console for details.");
        }
      }

      function isAllowedQuery(query) {
        const q = query.toLowerCase();
        const forbidden = ["drop", "delete", "truncate", "rename", "alter table ... drop"];
        return !forbidden.some((word) => q.includes(word));
      }

      function displayTable(data) {
        const tableHeaders = $("#tableHeaders");
        const tableBody = $("#tableBody");
        tableHeaders.empty();
        tableBody.empty();

        if (data.length > 0) {
          Object.keys(data[0]).forEach((key) => tableHeaders.append(`<th>${key}</th>`));
          const startIndex = (currentPage - 1) * rowsPerPage;
          const endIndex = Math.min(startIndex + rowsPerPage, data.length);
          for (let i = startIndex; i < endIndex; i++) {
            const row = $("<tr>");
            Object.values(data[i]).forEach((val) => row.append(`<td>${val}</td>`));
            tableBody.append(row);
          }
          updatePagination(data.length);
        } else {
          tableBody.append("<tr><td colspan='100%' class='text-center text-muted'>No data available</td></tr>");
        }
      }

      function updatePagination(totalRows) {
        const totalPages = Math.ceil(totalRows / rowsPerPage);
        $("#pageInfo").text(`Page ${currentPage} of ${totalPages}`);
        $("#prevPage").prop("disabled", currentPage === 1);
        $("#nextPage").prop("disabled", currentPage === totalPages);
      }

      $("#prevPage").click(() => {
        if (currentPage > 1) {
          currentPage--;
          displayTable(filteredData);
        }
      });

      $("#nextPage").click(() => {
        const totalPages = Math.ceil(filteredData.length / rowsPerPage);
        if (currentPage < totalPages) {
          currentPage++;
          displayTable(filteredData);
        }
      });

      $("#searchInput").on("input", function () {
        const searchVal = $(this).val().toLowerCase();
        const results = filteredData.filter((row) =>
          Object.values(row).some((val) => val && val.toString().toLowerCase().includes(searchVal))
        );
        displayTable(results);
      });
    });
  </script>

  <style>
    body {
      background-color: #f5f7fa;
      font-family: "Segoe UI", sans-serif;
    }
    .container-box {
      background: white;
      padding: 25px;
      margin-top: 30px;
      border-radius: 14px;
    }
    textarea {
      resize: vertical;
      min-height: 120px;
      font-family: monospace;
    }
    table {
      font-size: 14px;
    }
  </style>
</div>
